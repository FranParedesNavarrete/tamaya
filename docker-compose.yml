services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - tamaya-redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      API_PORT: ${API_PORT}
      API_CORS_ORIGIN: ${API_CORS_ORIGIN}
      TAMAYA_TMP_DIR: ${TAMAYA_TMP_DIR}
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "${API_PORT}:${API_PORT}"
    volumes:
      - ${TAMAYA_TMP_DIR}:${TAMAYA_TMP_DIR}
    depends_on:
      redis:
        condition: service_healthy

  worker-resolve:
    build:
      context: .
      dockerfile: apps/worker-resolve/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      TAMAYA_TMP_DIR: ${TAMAYA_TMP_DIR}
      LOG_LEVEL: ${LOG_LEVEL}
    volumes:
      - ${TAMAYA_TMP_DIR}:${TAMAYA_TMP_DIR}
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: "${APP_URL}:${API_PORT}"
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  tamaya-redis:
